global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/dora-alerts.yml

scrape_configs:
  - job_name: lottery-backend
    scheme: https
    static_configs:
      - targets: [xsmn.onrender.com]
    metrics_path: /metrics

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]

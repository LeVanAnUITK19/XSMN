name: Crawl_POST

# Disabled: replaced by Render Cron Job (scheduler/)
# Re-enable by restoring the schedule: block below
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual test'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: crawl
      - run: node crawlXSMN_POST.js
        working-directory: crawl

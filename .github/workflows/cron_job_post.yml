name: Crawl_POST

on:
  schedule:
    # 14:00, 14:15, 14:30, 14:45 giờ Việt Nam (UTC+7).
    - cron: '0,15,30,45 7 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual test'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: crawl
      - run: node crawlXSMN_POST.js
        working-directory: crawl

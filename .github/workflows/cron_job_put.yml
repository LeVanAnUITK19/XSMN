name: Crawl_PUT

on:
  schedule:
    # Mỗi 5 phút từ 15:00 đến 16:55 giờ Việt Nam (UTC+7).
    - cron: '*/5 8,9 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual test'

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      SCHEDULER_API_TOKEN: ${{ secrets.SCHEDULER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: crawl
      - run: node crawlXSMN_PUT.js
        working-directory: crawl

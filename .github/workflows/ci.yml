# CI — Continuous Integration (quality gate)
#
# Khi nào chạy:
#   - Mở / cập nhật Pull Request vào main
#   - Push trực tiếp lên main
#
# Việc gì xảy ra:
#   - Cài dependencies backend (npm ci)
#   - Chạy unit test trên matrix Node 18 / 20 / 22
#
# Việc KHÔNG làm:
#   - Không build / push Docker image
#   - Không deploy production
#
# PR fail test → merge bị chặn (nếu repo bật branch protection).
# Push main pass test → workflow CD được kích hoạt (xem cd.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  dora-report:
    name: DORA — report CI failure (main only)
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.test.result == 'failure'
        uses: actions/checkout@v4

      - name: Push change-failure metric
        if: needs.test.result == 'failure'
        env:
          DORA_PUSHGATEWAY_URL: ${{ secrets.DORA_PUSHGATEWAY_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/push-dora-metrics.sh deploy_failure

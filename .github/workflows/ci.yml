name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deploy (chỉ chạy test/scan)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: LINT & TEST
  # ============================================================
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # SHA cố định cho actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        # SHA cố định cho actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: node --test test/digit.test.js
        working-directory: backend

  # ============================================================
  # JOB 2: TRIVY SECURITY SCAN
  # ============================================================
  trivy:
    name: 🔒 Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Trivy scan — filesystem dependencies
        # SHA cố định cho aquasecurity/trivy-action@0.30.0
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          skip-dirs: node_modules

      - name: Trivy scan — Dockerfile config
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: config
          scan-ref: ./backend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ============================================================
  # JOB 3: SONARCLOUD CODE QUALITY
  # ============================================================
  sonar:
    name: 📊 SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        # SHA cố định cho SonarSource/sonarcloud-github-action@v3.1.0
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=LeVanAnUITK19_XSMN
            -Dsonar.organization=levananuitk19
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/test/**,**/*.test.js

  # ============================================================
  # JOB 4: DEPLOY TO RENDER
  # ============================================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [trivy]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.inputs.skip_deploy != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Detect changed services
        id: changes
        # SHA cố định cho dorny/paths-filter@v3.0.2
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            backend:
              - 'backend/**'
            observability:
              - 'observability/**'

      # Truyền secrets qua env thay vì inline trong run
      - name: Deploy Backend to Render
        if: steps.changes.outputs.backend == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          echo "🚀 Deploying backend..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Deploy trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Backend deploy triggered"

      - name: Deploy Prometheus to Render
        if: steps.changes.outputs.observability == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROMETHEUS }}
        run: |
          curl -s -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "✅ Prometheus deploy triggered"

      - name: Deploy Grafana to Render
        if: steps.changes.outputs.observability == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_GRAFANA }}
        run: |
          curl -s -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "✅ Grafana deploy triggered"

      - name: Wait for Render to deploy
        if: steps.changes.outputs.backend == 'true'
        run: |
          echo "⏳ Waiting 3 minutes for Render..."
          sleep 180

      - name: Health check backend
        if: steps.changes.outputs.backend == 'true'
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://xsmn-1.onrender.com/api/results/health)
            echo "Attempt $i/5: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check PASSED"
              exit 0
            fi
            [ $i -lt 5 ] && sleep 30
          done
          echo "❌ Health check FAILED"
          exit 1

  # ============================================================
  # JOB 5: NOTIFY
  # ============================================================
  notify:
    name: 📧 Send Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Send success email
        if: needs.deploy.result == 'success'
        # SHA cố định cho dawidd6/action-send-mail@v3.12.0
        uses: dawidd6/action-send-mail@2cea9f33a8e2ea62af8ff0b9fc4ac35c82e3afe6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ [XSMN] Deploy thành công"
          to: levanan1902006@gmail.com
          from: XSMN CI/CD <${{ secrets.GMAIL_USERNAME }}>
          body: |
            ✅ Deploy thành công!

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}

            Health check: PASSED ✅
            URL: https://xsmn-1.onrender.com/api/results/health

            Chi tiết: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: needs.deploy.result == 'failure'
        uses: dawidd6/action-send-mail@2cea9f33a8e2ea62af8ff0b9fc4ac35c82e3afe6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ [XSMN] Deploy THẤT BẠI — cần kiểm tra"
          to: levanan1902006@gmail.com
          from: XSMN CI/CD <${{ secrets.GMAIL_USERNAME }}>
          body: |
            ❌ Deploy thất bại!

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}

            Render đã rollback về version trước.
            Kiểm tra logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# CD — Continuous Delivery / Deployment
#
# Khi nào chạy:
#   - Sau khi workflow "CI" hoàn thành THÀNH CÔNG trên nhánh main
#   - Chỉ khi sự kiện gốc là push lên main (KHÔNG chạy sau PR)
#   - Có thể chạy tay: Actions → CD → Run workflow
#
# Việc gì xảy ra (tuần tự):
#   1. build-and-push — build Docker image từ backend/Dockerfile, đẩy lên GHCR
#      (tag latest + short commit SHA)
#   2. deploy — gọi Render deploy hook (nếu secret RENDER_DEPLOY_HOOK_URL đã cấu hình)
#   3. dora — push DORA metrics lên Pushgateway (nếu secret DORA_PUSHGATEWAY_URL đã cấu hình)
#
# PR vào main: chỉ CI chạy — CD không chạy.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  gate:
    name: Verify CI passed (push to main)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - name: CI gate OK
        run: echo "CI passed on main — proceeding to build and deploy."

  build-and-push:
    name: Docker build + push (GHCR)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Render hook)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping remote deploy. Image is still on ghcr.io."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy hook called OK."

      - name: Checkout for DORA scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Push DORA deploy metrics
        env:
          DORA_PUSHGATEWAY_URL: ${{ secrets.DORA_PUSHGATEWAY_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: main
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CI_START="${{ github.event.workflow_run.created_at }}"
            CI_EPOCH=$(date -d "${CI_START}" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            if [ "$CI_EPOCH" != "0" ]; then
              export LEAD_TIME_SECONDS=$((NOW_EPOCH - CI_EPOCH))
            else
              export LEAD_TIME_SECONDS=360
            fi
          else
            export LEAD_TIME_SECONDS=360
          fi
          bash scripts/push-dora-metrics.sh deploy_success

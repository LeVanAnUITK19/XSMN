version: '3.8'

services:

  node-exporter:
    image: prom/node-exporter

    container_name: xsmn-node-exporter

    ports:
      - "9100:9100"

    restart: unless-stopped

    networks:
      - app-net

  prometheus:
    image: prom/prometheus

    container_name: xsmn-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

    networks:
      - app-net

  grafana:
    image: grafana/grafana

    container_name: xsmn-grafana

    ports:
      - "3001:3000"

    restart: unless-stopped

    networks:
      - app-net

  nginx:
    image: nginx:latest

    container_name: xsmn-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xsmn-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_CONNECTIONSTRING: mongodb+srv://chatsay017_db_user:CLzZlfn82EPMpf06@cluster1.1ke8tg2.mongodb.net/lottery_app?retryWrites=true&w=majority
      REDIS_URL: rediss://default:gQAAAAAAARpMAAIncDI1M2RmY2U3YzlkODk0NjM5OTBjYmEwYWFjMDhjYTNkMnAyNzIyNjg@fond-alien-72268.upstash.io:6379
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/results/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-net

  crawl-put:
    build:
      context: ./crawl
      dockerfile: Dockerfile
    container_name: xsmn-crawl-put
    environment:
      API_URL: http://backend:3000/api/results
    command: ["node", "crawlXSMN_PUT.js"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    profiles:
      - crawler

  crawl-post:
    build:
      context: ./crawl
      dockerfile: Dockerfile
    container_name: xsmn-crawl-post
    environment:
      API_URL: http://backend:3000/api/results
    command: ["node", "crawlXSMN_POST.js"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    profiles:
      - crawler

networks:
  app-net:
    driver: bridge

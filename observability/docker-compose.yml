name: xsmn-observability

# ================================================================
# XSMN Observability Stack - Local Development
# ================================================================
# Chạy: docker compose --env-file .env up -d
#
# Truy cập:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000
#
# Backend (chạy riêng trên host):
#   Mac/Windows: tự động dùng host.docker.internal
#   Linux: xem README.md phần "Chạy trên Linux"
# ================================================================

services:

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: xsmn-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      BACKEND_TARGET: ${BACKEND_TARGET:-host.docker.internal:3000}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-7d}
    # Dùng entrypoint script để inject env vars vào config
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    volumes:
      # Gắn entrypoint script
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      # Persist time-series data (quan trọng!)
      # Nếu không mount volume, data mất khi container restart
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: xsmn-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_PROMETHEUS_URL: ${GF_PROMETHEUS_URL:-http://prometheus:9090}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Persist Grafana data (alerts, user settings, etc.)
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
